[workspace]
resolver = "2"
members = ["crates/qhlv"]

# Apps (apps/hlv, apps/<semantic-app>) and future crates are added here as they land.

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rand_distr = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
thiserror = "1"
sha2 = "0.10"
